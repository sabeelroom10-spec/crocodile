<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crocodile Seller Login</title>

    
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0d5c32, #168b45);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 450px;
}

.login-card {
    background: white;
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
}

.logo-area {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 60px;
    margin-bottom: 5px;
}

.logo-area h1 {
    color: #168b45;
    font-size: 32px;
}

.logo-area p {
    color: #777;
    margin-top: 5px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
}

.input-group input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.input-group input:focus {
    border-color: #168b45;
}

.login-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 8px;
    background: #168b45;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    background: #116c36;
    transform: translateY(-2px);
}

.login-message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
    min-height: 20px;
}

.bottom-links {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.bottom-links a {
    color: #168b45;
    text-decoration: none;
    font-size: 14px;
}

.bottom-links a:hover {
    text-decoration: underline;
}

@media (max-width: 500px) {
    .login-card {
        padding: 25px;
    }

    .bottom-links {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo-area">
                <div class="logo">🐊</div>
                <h1>Crocodile</h1>
                <p>Seller Login</p>
            </div>

            <form id="sellerLoginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    🔐 Login
                </button>

                <div id="loginMessage" class="login-message"></div>

            </form>

            <div class="bottom-links">
                <a href="seller.html">← Seller Registration</a>
                <a href="crocodile.html">Buyer Website</a>
            </div>

        </div>

    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CROCODILE - SUPABASE CLIENT
// Paste your Supabase Project URL and anon/public key below.
// NEVER put a Supabase service_role key in browser code.
// ============================================================
const SUPABASE_URL = "https://kczfbgqdsvlaghjhtevs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjemZiZ3Fkc3ZsYWdoamh0ZXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzc0MDksImV4cCI6MjEwNTgxMzQwOX0.zVcum-8MAy69fqNjKzLOTP7VCFYTOapMzH_uktJrKII";

if (!window.supabase) {
    console.error("Supabase JS library is not loaded.");
}

const supabaseClient = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

window.crocodileSupabase = supabaseClient;

</script>
<script>
// CROCODILE SELLER LOGIN - SUPABASE

const loginForm = document.getElementById("sellerLoginForm");
const loginMessage = document.getElementById("loginMessage");

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    loginMessage.textContent = "🔄 Checking login...";
    loginMessage.style.color = "#168b45";

    try {
        if (!window.crocodileSupabase) throw new Error("Supabase is not configured.");

        const { data, error } = await crocodileSupabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        const { data: seller, error: sellerError } = await crocodileSupabase
            .from("sellers")
            .select("id,first_name,last_name,email,shop_name,status")
            .eq("id", data.user.id)
            .single();

        if (sellerError) throw sellerError;

        if (seller.status !== "approved") {
            await crocodileSupabase.auth.signOut();

            if (seller.status === "pending") {
                throw new Error("Your seller application is still pending admin approval.");
            }
            throw new Error("Your seller application was rejected by the admin.");
        }

        sessionStorage.setItem("crocodileSellerId", seller.id);
        sessionStorage.setItem("crocodileSellerName", `${seller.first_name} ${seller.last_name}`);
        sessionStorage.setItem("crocodileSellerEmail", seller.email);

        loginMessage.textContent = "✅ Login successful! Opening dashboard...";
        loginMessage.style.color = "#168b45";

        setTimeout(() => {
            window.location.href = "seller-dashboard.html";
        }, 600);

    } catch (error) {
        console.error("Seller login error:", error);
        loginMessage.textContent = "❌ " + (error.message || "Seller login failed.");
        loginMessage.style.color = "#d32f2f";
    }
});

</script>
</body>
</html>
