<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crocodile Admin Login</title>

    
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #071f13, #0d3b24, #168b45);
    min-height: 100vh;
}

.login-page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 15px;
}

.login-card {
    width: 100%;
    max-width: 430px;

    background: white;

    padding: 40px;

    border-radius: 20px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.3);
}

.logo-area {
    text-align: center;
    margin-bottom: 25px;
}

.crocodile-logo {
    font-size: 65px;
    margin-bottom: 5px;
}

.logo-area h1 {
    font-size: 32px;
    color: #168b45;
}

.logo-area p {
    color: #666;
    margin-top: 5px;
    font-size: 15px;
}

.security-badge {
    text-align: center;

    background: #eef8f2;
    color: #168b45;

    padding: 11px;

    border-radius: 8px;

    font-size: 13px;
    font-weight: bold;

    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: #222;

    font-size: 14px;
    font-weight: bold;
}

.form-group input {
    width: 100%;

    height: 48px;

    padding: 0 14px;

    border: 2px solid #ddd;

    border-radius: 9px;

    outline: none;

    font-size: 15px;

    transition: 0.3s;
}

.form-group input:focus {
    border-color: #168b45;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 50px;
}

.toggle-password {
    position: absolute;

    right: 5px;
    top: 5px;

    width: 38px;
    height: 38px;

    border: none;
    background: transparent;

    cursor: pointer;

    font-size: 18px;
}

.login-btn {
    width: 100%;

    height: 50px;

    border: none;
    border-radius: 9px;

    background: #168b45;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.login-btn:hover {
    background: #116c36;
    transform: translateY(-2px);
}

.login-btn:disabled {
    background: #999;
    cursor: not-allowed;
    transform: none;
}

.login-message {
    min-height: 22px;

    text-align: center;

    margin-top: 15px;

    font-size: 14px;
    font-weight: bold;
}

.login-message.success {
    color: #168b45;
}

.login-message.error {
    color: #d62828;
}

.back-link {
    text-align: center;

    margin-top: 25px;
}

.back-link a {
    color: #168b45;

    text-decoration: none;

    font-size: 14px;
    font-weight: bold;
}

.back-link a:hover {
    text-decoration: underline;
}

.admin-warning {
    text-align: center;

    margin-top: 25px;

    padding-top: 18px;

    border-top: 1px solid #eee;

    color: #777;

    font-size: 12px;
}

@media (max-width: 500px) {

    .login-card {
        padding: 30px 20px;
    }

    .logo-area h1 {
        font-size: 28px;
    }

    .crocodile-logo {
        font-size: 55px;
    }
}
</style>
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo-area">
                <div class="crocodile-logo">🐊</div>

                <h1>Crocodile</h1>
                <p>Admin Panel</p>
            </div>

            <div class="security-badge">
                🔐 Secure Administrator Login
            </div>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="username">Admin Email</label>

                    <input
                        type="email"
                        id="username"
                        name="username"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            👁️
                        </button>

                    </div>
                </div>

                <button type="submit" class="login-btn">
                    🔐 Login to Admin Panel
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <div class="back-link">
                <a href="crocodile.html">
                    ← Back to Crocodile Website
                </a>
            </div>

            <div class="admin-warning">
                ⚠️ Authorized administrators only.
            </div>

        </div>

    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CROCODILE - SUPABASE CLIENT
// Paste your Supabase Project URL and anon/public key below.
// NEVER put a Supabase service_role key in browser code.
// ============================================================
const SUPABASE_URL = "https://kczfbgqdsvlaghjhtevs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjemZiZ3Fkc3ZsYWdoamh0ZXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzc0MDksImV4cCI6MjEwNTgxMzQwOX0.zVcum-8MAy69fqNjKzLOTP7VCFYTOapMzH_uktJrKII";

if (!window.supabase) {
    console.error("Supabase JS library is not loaded.");
}

const supabaseClient = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

window.crocodileSupabase = supabaseClient;

</script>
<script>
// CROCODILE ADMIN LOGIN - SUPABASE

const loginForm = document.getElementById("adminLoginForm");
const loginMessage = document.getElementById("loginMessage");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

if (togglePassword) {
    togglePassword.addEventListener("click", () => {
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
        togglePassword.textContent = passwordInput.type === "password" ? "👁️" : "🙈";
    });
}

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("username").value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!email || !password) {
        loginMessage.textContent = "❌ Please enter your email and password.";
        loginMessage.className = "login-message error";
        return;
    }

    loginMessage.textContent = "🔄 Checking admin credentials...";
    const button = loginForm.querySelector(".login-btn");
    if (button) button.disabled = true;

    try {
        if (!window.crocodileSupabase) throw new Error("Supabase is not configured.");

        const { data, error } = await crocodileSupabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        const { data: profile, error: profileError } = await crocodileSupabase
            .from("profiles")
            .select("id,email,full_name,role")
            .eq("id", data.user.id)
            .single();

        if (profileError) throw profileError;

        if (profile.role !== "admin") {
            await crocodileSupabase.auth.signOut();
            throw new Error("This account is not an administrator.");
        }

        sessionStorage.setItem("crocodileAdminId", profile.id);
        sessionStorage.setItem("crocodileAdminUsername", profile.email || email);

        loginMessage.textContent = "✅ Login successful! Opening Admin Panel...";
        loginMessage.className = "login-message success";

        setTimeout(() => {
            window.location.href = "admin-dashboard.html";
        }, 600);

    } catch (error) {
        console.error("Admin login error:", error);
        loginMessage.textContent = "❌ " + (error.message || "Admin login failed.");
        loginMessage.className = "login-message error";
    } finally {
        if (button) button.disabled = false;
    }
});

</script>
</body>
</html>
